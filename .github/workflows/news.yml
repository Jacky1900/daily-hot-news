name: Daily Hot News

on:
  schedule:
    # GitHub cron 用 UTC 时间（北京时间 = UTC + 8 小时）
    # 特意避开整点：整点是全球定时任务最集中的时刻，GitHub 会排队延迟十几分钟
    - cron: "37 22 * * *"    # 北京 06:37
    - cron: "37 14 * * *"    # 北京 22:37
  workflow_dispatch:        # 允许网页手动点 "Run workflow" / cron-job.org 调接口触发

permissions:
  contents: write           # 允许 Actions 把"已推送记录"写回仓库

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行新闻抓取与推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BAIDU_TRANS_APPID: ${{ secrets.BAIDU_TRANS_APPID }}
          BAIDU_TRANS_SECRET: ${{ secrets.BAIDU_TRANS_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
        run: python news_bot.py

      - name: 保存"已推送"记录（防止同一天重复推送）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          git add -A state/ || true
          if [ -n "$(git diff --staged --name-only)" ]; then
            git commit -m "chore: update pushed state"
            git push
          else
            echo "状态无变化，跳过提交"
          fi
